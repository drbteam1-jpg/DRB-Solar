<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DRB오토모티브 태양광 발전 대시보드</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/ko.js"></script>
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif; background:#111827; color:#e2e8f0; min-height:100vh; }
  .header { background:linear-gradient(135deg,#1e293b 0%,#111827 100%); padding:20px 32px; border-bottom:1px solid #334155; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:16px; }
  .header-left { display:flex; align-items:center; gap:16px; }
  .header-icon { font-size:2.2rem; }
  .header-left h1 { font-size:1.4rem; font-weight:700; color:#f1f5f9; }
  .header-left p  { font-size:0.8rem; color:#94a3b8; margin-top:3px; }
  .header-right { font-size:0.78rem; color:#64748b; }
  .header-right-group { display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  .filter-bar { background:#1e293b; padding:12px 32px; border-bottom:1px solid #334155; display:flex; align-items:center; gap:18px; flex-wrap:wrap; }
  .filter-divider { width:1px; height:28px; background:#334155; flex-shrink:0; }
  .filter-label { font-size:0.72rem; color:#94a3b8; font-weight:600; letter-spacing:.5px; text-transform:uppercase; white-space:nowrap; }
  .date-group { display:flex; align-items:center; gap:7px; }
  .date-input { background:#293548; border:1px solid #475569; border-radius:6px; color:#e2e8f0; padding:7px 11px; font-size:0.82rem; width:126px; cursor:pointer; outline:none; }
  .date-input:focus { border-color:#38bdf8; }
  .date-sep { color:#64748b; }
  .btn { padding:7px 15px; border-radius:6px; border:none; cursor:pointer; font-size:0.8rem; font-weight:600; transition:all .15s; font-family:inherit; }
  .btn-primary   { background:#0ea5e9; color:#fff; }
  .btn-primary:hover { background:#0284c7; }
  .btn-secondary { background:#293548; border:1px solid #475569; color:#94a3b8; }
  .btn-secondary:hover { background:#344562; }
  .quick-btns { display:flex; gap:5px; }
  .quick-btn { padding:6px 11px; border-radius:20px; border:1px solid #475569; background:#293548; color:#94a3b8; font-size:0.73rem; cursor:pointer; transition:all .15s; white-space:nowrap; font-family:inherit; }
  .quick-btn:hover { background:#344562; color:#e2e8f0; }
  .quick-btn.active { background:#0ea5e9; border-color:#0ea5e9; color:#fff; }
  .gran-seg { display:flex; background:#1a2535; border:1px solid #475569; border-radius:8px; overflow:hidden; }
  .gran-btn { padding:7px 20px; border:none; background:transparent; color:#94a3b8; font-size:0.8rem; font-weight:700; cursor:pointer; transition:all .15s; font-family:inherit; white-space:nowrap; position:relative; }
  .gran-btn + .gran-btn { border-left:1px solid #475569; }
  .gran-btn:hover { color:#e2e8f0; background:#283548; }
  .gran-btn.active { background:#0ea5e9; color:#fff; border-color:#0ea5e9; box-shadow:inset 0 1px 4px rgba(0,0,0,.25); }
  .gran-btn.active + .gran-btn { border-left-color:#0ea5e9; }
  .kpi-row { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; padding:20px 32px 0; }
  .kpi-card { background:#1e293b; border:1px solid #334155; border-radius:10px; padding:16px 18px; position:relative; overflow:hidden; }
  .kpi-card::before { content:''; position:absolute; top:0; left:0; right:0; height:3px; border-radius:10px 10px 0 0; }
  .kpi-green::before  { background:linear-gradient(90deg,#10b981,#34d399); }
  .kpi-blue::before   { background:linear-gradient(90deg,#2dd4bf,#5eead4); }
  .kpi-orange::before { background:linear-gradient(90deg,#f59e0b,#fbbf24); }
  .kpi-purple::before { background:linear-gradient(90deg,#8b5cf6,#a78bfa); }
  .kpi-label { font-size:0.82rem; color:#94a3b8; font-weight:600; text-transform:uppercase; letter-spacing:.5px; margin-bottom:8px; }
  .kpi-value { font-size:1.9rem; font-weight:700; color:#f1f5f9; line-height:1; }
  .kpi-unit  { font-size:0.88rem; color:#94a3b8; margin-left:4px; font-weight:400; }
  .kpi-sub   { font-size:0.8rem; color:#64748b; margin-top:6px; }
  .charts-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; padding:16px 32px 32px; }
  .chart-card { background:#1e293b; border:1px solid #334155; border-radius:10px; overflow:hidden; }
  .chart-header { padding:14px 18px 10px; border-bottom:1px solid #2d3f52; }
  .chart-header h3 { font-size:1rem; font-weight:700; color:#e2e8f0; }
  .chart-header p  { font-size:0.8rem; color:#64748b; margin-top:4px; }
  .chart-body { height:300px; padding:4px; }
  .no-data { display:flex; align-items:center; justify-content:center; height:100%; color:#64748b; font-size:.85rem; }
  @media (max-width:1000px) { .charts-grid { grid-template-columns:1fr; } .kpi-row { grid-template-columns:repeat(2,1fr); } }
  @media (max-width:600px)  { .kpi-row { grid-template-columns:1fr; } .filter-bar { flex-direction:column; align-items:flex-start; } .header { flex-direction:column; } }
  .flatpickr-calendar { background:#293548 !important; border:1px solid #475569 !important; box-shadow:0 8px 32px rgba(0,0,0,.5) !important; }
  .flatpickr-day { color:#cbd5e1 !important; border-radius:4px !important; }
  .flatpickr-day:hover { background:#344562 !important; }
  .flatpickr-day.selected,.flatpickr-day.startRange,.flatpickr-day.endRange { background:#0ea5e9 !important; border-color:#0ea5e9 !important; color:#fff !important; }
  .flatpickr-day.inRange { background:#1a4060 !important; border-color:transparent !important; box-shadow:none !important; }
  .flatpickr-month,.flatpickr-weekdays { background:#293548 !important; }
  .flatpickr-weekday { color:#94a3b8 !important; }
  .flatpickr-current-month { color:#cbd5e1 !important; }
  .flatpickr-months .flatpickr-prev-month,.flatpickr-months .flatpickr-next-month { color:#cbd5e1 !important; fill:#cbd5e1 !important; }
  .numInputWrapper input { color:#cbd5e1 !important; }
  .flatpickr-monthDropdown-months { color:#cbd5e1 !important; background:#293548 !important; }
  span.arrowUp:after,span.arrowDown:after { border-bottom-color:#94a3b8 !important; border-top-color:#94a3b8 !important; }
  @keyframes chatPulse { 0%,100% { box-shadow:0 4px 20px rgba(14,165,233,.55),0 0 0 0 rgba(45,212,191,.45); } 50% { box-shadow:0 4px 24px rgba(14,165,233,.7),0 0 0 8px rgba(45,212,191,0); } }
  .chat-fab { position:fixed; bottom:24px; right:24px; width:58px; height:58px; border-radius:50%; background:linear-gradient(135deg,#2dd4bf 0%,#0ea5e9 100%); color:#fff; border:2px solid rgba(255,255,255,.15); font-size:1.6rem; cursor:pointer; z-index:1000; display:flex; align-items:center; justify-content:center; transition:transform .2s ease; animation:chatPulse 2.8s ease-in-out infinite; }
  .chat-fab:hover { transform:scale(1.1) rotate(-4deg); animation-play-state:paused; }
  .chat-panel { position:fixed; bottom:92px; right:24px; width:430px; max-width:calc(100vw - 32px); height:620px; max-height:calc(100vh - 120px); background:#1e293b; border:1px solid #334155; border-radius:14px; box-shadow:0 12px 40px rgba(0,0,0,.5); display:none; flex-direction:column; overflow:hidden; z-index:1000; }
  .chat-header { background:linear-gradient(135deg,#0ea5e9 0%,#134e6b 55%,#111827 100%); padding:12px 16px; border-bottom:1px solid #334155; display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
  .chat-header span { font-weight:700; font-size:.9rem; color:#f1f5f9; display:flex; align-items:center; gap:7px; }
  .chat-header .chat-dot { width:7px; height:7px; border-radius:50%; background:#34d399; box-shadow:0 0 6px #34d399; display:inline-block; }
  .chat-close { background:none; border:none; color:#94a3b8; font-size:1.1rem; cursor:pointer; line-height:1; }
  .chat-close:hover { color:#e2e8f0; }
  .chat-messages { flex:1; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:10px; }
  .chat-msg { max-width:85%; padding:8px 12px; border-radius:10px; font-size:.82rem; line-height:1.55; }
  .chat-bot { align-self:flex-start; background:#293548; color:#e2e8f0; border-bottom-left-radius:2px; }
  .chat-user { align-self:flex-end; background:#0ea5e9; color:#fff; border-bottom-right-radius:2px; }
  .chat-input-row { display:flex; gap:8px; padding:12px; border-top:1px solid #334155; flex-shrink:0; }
  .chat-input-row input { flex:1; min-width:0; background:#293548; border:1px solid #475569; border-radius:8px; color:#e2e8f0; padding:8px 12px; font-size:.82rem; outline:none; font-family:inherit; }
  .chat-input-row input:focus { border-color:#38bdf8; }
  .chat-input-row button { background:#0ea5e9; color:#fff; border:none; border-radius:8px; padding:8px 14px; font-size:.82rem; font-weight:600; cursor:pointer; flex-shrink:0; }
  .chat-input-row button:hover { background:#0284c7; }
  .chat-panel.chat-wide { width:760px; height:calc(100vh - 120px); }
  .chat-hbtns { display:flex; gap:10px; align-items:center; }
  .chat-bot { max-width:94%; }
  .chat-chips { display:flex; flex-wrap:wrap; gap:6px; padding:8px 12px 0; flex-shrink:0; }
  .chat-chip { background:#1e3a4c; border:1px solid #2b5c74; color:#bae6fd; border-radius:14px; padding:4px 10px; font-size:.74rem; cursor:pointer; font-family:inherit; }
  .chat-chip:hover { background:#0e7490; color:#fff; }
  .chat-msg h4 { margin:10px 0 4px; font-size:.8rem; color:#7dd3fc; }
  .chat-msg h4:first-child { margin-top:0; }
  .an-tbl { border-collapse:collapse; width:100%; margin:4px 0; font-size:.74rem; }
  .an-tbl th { background:#1e293b; color:#94a3b8; font-weight:600; padding:3px 5px; border-bottom:1px solid #475569; text-align:right; white-space:nowrap; }
  .an-tbl td { padding:3px 5px; border-bottom:1px solid #334155; text-align:right; white-space:nowrap; }
  .an-tbl th:first-child, .an-tbl td:first-child { text-align:left; }
  .an-tbl tr.an-flag td { background:rgba(248,113,113,.10); }
  .an-up { color:#34d399; } .an-dn { color:#f87171; } .an-mut { color:#64748b; }
  .an-tag { display:inline-block; padding:0 6px; border-radius:8px; font-size:.68rem; font-weight:600; margin-left:3px; }
  .an-warn { background:rgba(248,113,113,.18); color:#fca5a5; }
  .an-info { background:rgba(56,189,248,.16); color:#7dd3fc; }
  .an-ok { background:rgba(52,211,153,.16); color:#6ee7b7; }
  .an-box { background:#1e293b; border-left:3px solid #38bdf8; padding:6px 8px; margin:6px 0 2px; border-radius:4px; }
  .an-note { color:#94a3b8; font-size:.72rem; }
  .chat-chart { width:100%; height:190px; margin-top:6px; }
</style>
</head>
<body>
<div class="header">
  <div class="header-left">
    <div class="header-icon">&#9728;&#65039;</div>
    <div>
      <h1>DRB오토모티브 태양광 발전 대시보드</h1>
      <p>발전량 일별 Trend &nbsp;·&nbsp; 주차별 태양광 사용비율</p>
    </div>
  </div>
  <div class="header-right-group">
    <div class="gran-seg" id="factorySeg">
      <button class="gran-btn active" id="fAll" onclick="setFactory('all',this)">전체</button>
      <button class="gran-btn" id="f1" onclick="setFactory('1',this)">1공장</button>
      <button class="gran-btn" id="f2" onclick="setFactory('2',this)">2공장</button>
    </div>
    <div class="header-right">데이터 기간: 2024.06.29 ~ 2026.09.30</div>
  </div>
</div>
<div class="filter-bar">
  <span class="filter-label">&#128197; 기간 설정</span>
  <div class="date-group">
    <input type="text" id="dateFrom" class="date-input" placeholder="시작일" readonly>
    <span class="date-sep">~</span>
    <input type="text" id="dateTo"   class="date-input" placeholder="종료일" readonly>
    <button class="btn btn-primary"   onclick="applyFilter()">적용</button>
    <button class="btn btn-secondary" onclick="resetFilter()">전체 기간</button>
  </div>
  <div class="quick-btns">
    <button class="quick-btn" id="q3"   onclick="setQuick(3,this)">최근 3개월</button>
    <button class="quick-btn" id="q6"   onclick="setQuick(6,this)">최근 6개월</button>
    <button class="quick-btn active" id="q12"  onclick="setQuick(12,this)">최근 1년</button>
    <button class="quick-btn" id="qAll" onclick="setQuick(0,this)">전체</button>
  </div>
  <div class="filter-divider"></div>
  <span class="filter-label">&#128280; 기간 단위</span>
  <div class="gran-seg" id="granSeg">
    <button class="gran-btn" id="gD" onclick="setGran('daily',this)">일간</button>
    <button class="gran-btn" id="gW" onclick="setGran('weekly',this)">주간</button>
    <button class="gran-btn active" id="gM" onclick="setGran('monthly',this)">월간</button>
  </div>
</div>
<div class="kpi-row">
  <div class="kpi-card kpi-green">
    <div class="kpi-label">&#9889; 총 태양광 발전량</div>
    <div class="kpi-value" id="kpiTotalGen">-<span class="kpi-unit">MWh</span></div>
    <div class="kpi-sub"   id="kpiTotalGenSub"></div>
  </div>
  <div class="kpi-card kpi-blue">
    <div class="kpi-label">&#128202; 평균 일일 발전량</div>
    <div class="kpi-value" id="kpiAvgDaily">-<span class="kpi-unit">kWh</span></div>
    <div class="kpi-sub"   id="kpiDays"></div>
  </div>
  <div class="kpi-card kpi-orange">
    <div class="kpi-label">&#128338; 평균 발전시간</div>
    <div class="kpi-value" id="kpiAvgHours">-<span class="kpi-unit">h</span></div>
    <div class="kpi-sub">목표: 3.5시간 / 일</div>
  </div>
  <div class="kpi-card kpi-purple">
    <div class="kpi-label">&#127928; 태양광 사용비율</div>
    <div class="kpi-value" id="kpiAvgRatio">-<span class="kpi-unit">%</span></div>
  </div>
</div>
<div class="charts-grid">
  <div class="chart-card">
    <div class="chart-header">
      <h3 id="h1title">&#128200; 태양광 발전량 Trend</h3>
      <p  id="h1sub"></p>
    </div>
    <div class="chart-body"><div id="chart1" style="height:100%;"></div></div>
  </div>
  <div class="chart-card">
    <div class="chart-header">
      <h3 id="h2title">&#9201; 평균 발전시간</h3>
      <p  id="h2sub"></p>
    </div>
    <div class="chart-body"><div id="chart2" style="height:100%;"></div></div>
  </div>
  <div class="chart-card">
    <div class="chart-header">
      <h3 id="h3title">&#128268; 전력사용량 vs 태양광 발전량</h3>
      <p  id="h3sub"></p>
    </div>
    <div class="chart-body"><div id="chart3" style="height:100%;"></div></div>
  </div>
  <div class="chart-card">
    <div class="chart-header">
      <h3 id="h4title">&#127775; 태양광 사용비율</h3>
      <p  id="h4sub"></p>
    </div>
    <div class="chart-body"><div id="chart4" style="height:100%;"></div></div>
  </div>
</div>
<button class="chat-fab" id="chatFab" onclick="chatToggle()" title="발전량 Q&amp;A 챗봇">&#128172;</button>
<div class="chat-panel" id="chatPanel">
  <div class="chat-header"><span>&#9728;&#65039; 발전량 분석 챗봇<i class="chat-dot"></i></span><div class="chat-hbtns"><button class="chat-close" onclick="chatWide()" title="크게 보기">&#10530;</button><button class="chat-close" onclick="chatToggle()">&#10005;</button></div></div>
  <div class="chat-messages" id="chatMessages"></div>
  <div class="chat-chips" id="chatChips"></div>
  <div class="chat-input-row">
    <input type="text" id="chatInput" placeholder="예: 이번달 발전량 알려줘">
    <button onclick="chatSend()">전송</button>
  </div>
</div>

function chatYearFull(y){const n=+y;return n<100?2000+n:n;}

// 문자열 안에서 기간 표현을 "전부" 찾아 순서대로 배열로 반환 (다중 기간 비교/나열 질문 지원)
// fy/fm~ty/tm: "24년9월~25년8월"처럼 두 지점 모두 연도가 따로 붙는 범위 (연도가 다른 12개월 구간 등) — 가장 먼저 시도
const CHAT_PERIOD_RE=/(?<fy>\d{2,4})\s*년\s*(?<fm>\d{1,2})\s*월\s*[~\-]\s*(?<ty>\d{2,4})\s*년\s*(?<tm>\d{1,2})\s*월|(?<ry>\d{2,4})\s*년\s*(?<rm1>\d{1,2})\s*[~\-]\s*(?<rm2>\d{1,2})\s*월|(?<my>\d{2,4})\s*년\s*(?<mm>\d{1,2})\s*월|(?<hy>\d{2,4})\s*년\s*(?<half>상|하)\s*반기|(?<qy>\d{2,4})\s*년\s*(?<q>[1-4])\s*분기|(?<yo>\d{2,4})\s*년(?!\s*\d)|(?<half2>상|하)\s*반기|(?<q2>[1-4])\s*분기|(?<recY>최근\s*\d+\s*년)|(?<r2m1>\d{1,2})\s*[~\-]\s*(?<r2m2>\d{1,2})\s*월|(?<smm>\d{1,2})\s*월(?!평균|간)|(?<thisM>이번\s*달|이달|당월)|(?<lastM>지난\s*달|저번\s*달|전달)|(?<thisY>올해|금년)|(?<lastY>작년)|(?<today>오늘)|(?<yest>어제)|(?<recD>최근\s*\d+\s*일)|(?<recM>최근\s*\d+\s*개?월)/g;
function chatFindAllPeriods(text){
  const lastYM=RAW.daily[RAW.daily.length-1].date.slice(0,7),lastYear=+lastYM.slice(0,4);
  const out=[];
  for(const m of text.matchAll(CHAT_PERIOD_RE)){
    const g=m.groups;
    if(g.fy!==undefined){const y1=chatYearFull(g.fy),m1=+g.fm,y2=chatYearFull(g.ty),m2=+g.tm;out.push({mode:'yearMonthRange',y1,m1,y2,m2,label:y1+'년 '+m1+'월~'+y2+'년 '+m2+'월'});}
    else if(g.ry!==undefined){const y=chatYearFull(g.ry),m1=+g.rm1,m2=+g.rm2;out.push({mode:'monthRange',year:y,m1,m2,label:y+'년 '+m1+'~'+m2+'월'});}
    else if(g.my!==undefined){const y=chatYearFull(g.my),mo=+g.mm;const ym=y+'-'+String(mo).padStart(2,'0');out.push({mode:'month',ym,label:chatMonthLabel(ym)});}
    else if(g.hy!==undefined||g.half2!==undefined){const y=g.hy!==undefined?chatYearFull(g.hy):lastYear,h1=(g.half||g.half2)==='상';out.push({mode:'yearMonthRange',y1:y,m1:h1?1:7,y2:y,m2:h1?6:12,label:y+'년 '+(h1?'상':'하')+'반기'});}
    else if(g.qy!==undefined||g.q2!==undefined){const y=g.qy!==undefined?chatYearFull(g.qy):lastYear,q=+(g.q||g.q2);out.push({mode:'yearMonthRange',y1:y,m1:q*3-2,y2:y,m2:q*3,label:y+'년 '+q+'분기'});}
    else if(g.yo!==undefined){const y=chatYearFull(g.yo);out.push({mode:'year',year:y,label:y+'년'});}
    else if(g.recY!==undefined){const n=+g.recY.match(/\d+/)[0];out.push({mode:'recentMonths',n:n*12,label:'최근 '+n+'년'});}
    else if(g.r2m1!==undefined){const m1=+g.r2m1,m2=+g.r2m2;out.push({mode:'monthRange',year:lastYear,m1,m2,label:lastYear+'년 '+m1+'~'+m2+'월'});}
    else if(g.smm!==undefined){const mo=+g.smm;const ym=lastYear+'-'+String(mo).padStart(2,'0');out.push({mode:'month',ym,label:chatMonthLabel(ym)});}
    else if(g.thisM!==undefined)out.push({mode:'month',ym:lastYM,label:chatMonthLabel(lastYM)});
    else if(g.lastM!==undefined){const ym=chatPrevMonth(lastYM);out.push({mode:'month',ym,label:chatMonthLabel(ym)});}
    else if(g.thisY!==undefined)out.push({mode:'year',year:lastYear,label:lastYear+'년'});
    else if(g.lastY!==undefined)out.push({mode:'year',year:lastYear-1,label:(lastYear-1)+'년'});
    else if(g.today!==undefined)out.push({mode:'day',idx:-1,label:'오늘'});
    else if(g.yest!==undefined)out.push({mode:'day',idx:-2,label:'어제'});
    else if(g.recD!==undefined){const n=+g.recD.match(/\d+/)[0];out.push({mode:'recentDays',n,label:'최근 '+n+'일'});}
    else if(g.recM!==undefined){const n=+g.recM.match(/\d+/)[0];out.push({mode:'recentMonths',n,label:'최근 '+n+'개월'});}
  }
  return out;
}
// {from,to} 날짜 범위로 환산 ('day'/'all'은 별도 처리)
function chatPeriodRange(period){
  if(period.mode==='month')return{from:period.ym+'-01',to:period.ym+'-31'};
  if(period.mode==='year')return{from:period.year+'-01-01',to:period.year+'-12-31'};
  if(period.mode==='monthRange'){
    const y2=period.m2<period.m1?period.year+1:period.year;
    return{from:period.year+'-'+String(period.m1).padStart(2,'0')+'-01',to:y2+'-'+String(period.m2).padStart(2,'0')+'-31'};
  }
  if(period.mode==='yearMonthRange'){
    return{from:period.y1+'-'+String(period.m1).padStart(2,'0')+'-01',to:period.y2+'-'+String(period.m2).padStart(2,'0')+'-31'};
  }
  if(period.mode==='recentDays'){const arr=RAW.daily.slice(-period.n);return arr.length?{from:arr[0].date,to:arr[arr.length-1].date}:{from:'9999-99-99',to:'0000-00-00'};}
  if(period.mode==='recentMonths'){const last=RAW.daily[RAW.daily.length-1].date,dt=new Date(last);dt.setMonth(dt.getMonth()-period.n);return{from:dt.toISOString().slice(0,10),to:last};}
  return{from:null,to:null};   // 'all'
}
// monthRange/yearMonthRange 기간에 포함된 'YYYY-MM' 목록 (월별 비교용). 그 외 모드는 null.
function chatMonthsInRange(period){
  let y1,m1,y2,m2;
  if(period.mode==='yearMonthRange'){y1=period.y1;m1=period.m1;y2=period.y2;m2=period.m2;}
  else if(period.mode==='monthRange'){y1=period.year;m1=period.m1;y2=period.m2<period.m1?period.year+1:period.year;m2=period.m2;}
  else if(period.mode==='year'){y1=y2=period.year;m1=1;m2=12;}
  else return null;
  const out=[];let y=y1,m=m1;
  while(y<y2||(y===y2&&m<=m2)){
    out.push(y+'-'+String(m).padStart(2,'0'));
    m++;if(m>12){m=1;y++;}
    if(out.length>60)break;   // 안전장치
  }
  return out;
}
function chatFilterDaily(period){
  if(period.mode==='day'){const i=RAW.daily.length+period.idx;return i>=0?[RAW.daily[i]]:[];}
  const r=chatPeriodRange(period);
  return RAW.daily.filter(d=>(!r.from||d.date>=r.from)&&(!r.to||d.date<=r.to));
}
function chatFilterUsage(period){
  if(period.mode==='day'){const dm=chatFilterDaily(period);return dm.length?RAW.usage.filter(d=>d.date===dm[0].date):[];}
  const r=chatPeriodRange(period);
  return RAW.usage.filter(d=>(!r.from||d.date>=r.from)&&(!r.to||d.date<=r.to));
}
function chatStats(period,fac){
  const daily=chatFilterDaily(period),usage=chatFilterUsage(period);
  const kwh=daily.reduce((s,d)=>s+(d['kwh_'+fac]||0),0);
  const hrs=daily.length?daily.reduce((s,d)=>s+(d['hrs_'+fac]||0),0)/daily.length:0;
  const totU=usage.reduce((s,d)=>s+(d['usage_'+fac]||0),0);
  const totS=usage.reduce((s,d)=>s+(d['solar_'+fac]||0),0);
  const ratio=totU>0?totS/totU*100:0;
  return{days:daily.length,kwh,hrs,usage:totU,solar:totS,ratio};
}
function chatFactoryLabel(fac){return fac==='all'?'전체':fac+'공장';}
function chatDetectFactories(text){
  const has1=/1\s*공장/.test(text),has2=/2\s*공장/.test(text);
  if((has1&&has2)||/각각|각자|공장\s*별|1\s*[,·및와과&\/]\s*2\s*공장|양\s*공장|두\s*공장|공장\s*간/.test(text))return['1','2'];
  if(has1)return['1'];
  if(has2)return['2'];
  return['all'];
}
function chatDetectMetrics(text){
  const out=[];
  if(/사용\s*비율|비율/.test(text))out.push('ratio');
  if(/발전\s*시간|가동\s*시간/.test(text))out.push('hours');
  if(/발전\s*량/.test(text))out.push('gen');
  if(/사용량|전력\s*사용|전기\s*사용/.test(text))out.push('usage');
  return out;
}
function chatFmt(n,d=1){return n==null||isNaN(n)?'-':n.toLocaleString('ko-KR',{minimumFractionDigits:d,maximumFractionDigits:d});}
function chatMetricLine(stats,metric){
  if(metric==='gen')return'발전량 '+chatFmt(stats.kwh/1000,2)+'MWh ('+chatFmt(stats.kwh,0)+'kWh)';
  if(metric==='hours')return'평균 발전시간 '+chatFmt(stats.hrs,2)+'h';
  if(metric==='usage')return'전력사용량 '+chatFmt(stats.usage/1000,2)+'MWh';
  if(metric==='ratio')return'태양광 사용비율 '+chatFmt(stats.ratio,1)+'%';
  return'';
}
// ── "왜 차이나?" 후속 질문 지원 (직전 조회 내용만 기억하는 최소한의 맥락) ──────
let chatLastCtx=null;   // {periods, facs, metrics}
function chatIsWhyFollowup(text){
  return /왜|원인|이유가|차이.{0,4}(나|커|크|많)/.test(text)
    && !chatFindAllPeriods(text).length && !chatDetectMetrics(text).length
    && !/1\s*공장|2\s*공장/.test(text);
}
function chatGapField(metric){return{gen:'kwh_',hours:'hrs_',usage:'usage_',ratio:'ratio_'}[metric]||'kwh_';}
function chatGapValFmt(metric,v){return metric==='hours'?chatFmt(v,2):metric==='ratio'?chatFmt(v,1):chatFmt(v,0);}
function chatGapUnit(metric){return metric==='hours'?'h':metric==='ratio'?'%':'kWh';}
function chatDailyGapRows(period,fac1,fac2,metric){
  const prefix=chatGapField(metric);
  const arr=(metric==='usage'||metric==='ratio')?chatFilterUsage(period):chatFilterDaily(period);
  const rows=arr.map(d=>({date:d.date,v1:d[prefix+fac1]||0,v2:d[prefix+fac2]||0}));
  rows.forEach(r=>r.gap=Math.abs(r.v1-r.v2));
  rows.sort((a,b)=>b.gap-a.gap);
  return rows.slice(0,3);
}
function chatWhyFactoryAnswer(){
  const{periods,facs,metrics}=chatLastCtx,period=periods[0],metric=metrics[0];
  const rows=chatDailyGapRows(period,facs[0],facs[1],metric);
  if(!rows.length||rows[0].gap===0)return'일별로 봐도 뚜렷하게 차이나는 날은 없었어요.';
  const unit=chatGapUnit(metric);
  const lines=rows.map(r=>'· '+r.date+': '+chatFactoryLabel(facs[0])+' '+chatGapValFmt(metric,r.v1)+unit+' / '+chatFactoryLabel(facs[1])+' '+chatGapValFmt(metric,r.v2)+unit+' (차이 '+chatGapValFmt(metric,r.gap)+unit+')');
  let note='';
  if(metric==='hours')note='<br><br>※ 발전시간은 이미 설비용량(kW) 대비로 계산된 값이라 설비 규모 차이 때문은 아니에요. 음영·오염·인버터 상태 등이 원인일 수 있으니 해당 날짜를 확인해보시는 게 좋아요.';
  return'<b>'+period.label+' '+chatFactoryLabel(facs[0])+' vs '+chatFactoryLabel(facs[1])+' 차이가 컸던 날 (상위 '+rows.length+'개)</b><br>'+lines.join('<br>')+note;
}
// 두 기간이 모두 여러 달짜리 범위(monthRange/yearMonthRange)이고 길이가 같으면,
// 같은 순번의 달끼리 짝지어 어느 달에서 차이가 가장 컸는지 보여준다 (예: 1년 vs 1년의 9월끼리 비교).
function chatMonthByMonthCompare(period1,period2,fac,metric){
  const months1=chatMonthsInRange(period1),months2=chatMonthsInRange(period2);
  if(!months1||!months2||months1.length!==months2.length)return null;
  const arr=(metric==='usage'||metric==='ratio')?RAW.monthly_usage:RAW.monthly_gen;
  const field=chatGapField(metric)+fac;
  const byMonth={};arr.forEach(r=>{byMonth[r.month]=r;});
  const rows=months1.map((mo1,i)=>{
    const mo2=months2[i];
    const v1=(byMonth[mo1]||{})[field]||0,v2=(byMonth[mo2]||{})[field]||0;
    return{mo1,mo2,v1,v2,gap:Math.abs(v1-v2)};
  });
  rows.sort((a,b)=>b.gap-a.gap);
  return rows;
}
function chatWhyPeriodAnswer(){
  const{periods,facs,metrics}=chatLastCtx,metric=metrics[0],fac=facs[0];
  const rows=chatMonthByMonthCompare(periods[0],periods[1],fac,metric);
  if(rows){
    if(!rows.length||rows[0].gap===0)return'월별로 봐도 뚜렷하게 차이나는 달은 없었어요.';
    const unit=chatGapUnit(metric),top=rows.slice(0,3);
    const lines=top.map(r=>'· '+chatMonthLabel(r.mo1)+' vs '+chatMonthLabel(r.mo2)+': '+chatGapValFmt(metric,r.v1)+unit+' → '+chatGapValFmt(metric,r.v2)+unit+' (차이 '+chatGapValFmt(metric,r.gap)+unit+')');
    return'<b>'+periods[0].label+' vs '+periods[1].label+' '+chatFactoryLabel(fac)+' — 차이가 컸던 달 (상위 '+top.length+'개)</b><br>'+lines.join('<br>');
  }
  const s1=chatStats(periods[0],fac),s2=chatStats(periods[1],fac);
  const pick=s=>metric==='gen'?s.kwh:metric==='hours'?s.hrs:metric==='usage'?s.usage:s.ratio;
  const v1=pick(s1),v2=pick(s2),diff=v2-v1,pct=v1!==0?(diff/v1*100):null,unit=chatGapUnit(metric);
  const dir=diff>=0?'증가':'감소';
  let txt=periods[1].label+'은(는) '+periods[0].label+' 대비 '+chatGapValFmt(metric,Math.abs(diff))+unit+' '+dir;
  if(pct!==null)txt+=' ('+chatFmt(Math.abs(pct),1)+'%)';
  return'<b>'+periods[0].label+' vs '+periods[1].label+' '+chatFactoryLabel(fac)+'</b><br>'+txt+'했어요.<br><br>날짜별로 어디서 차이가 컸는지 보려면 "1공장이랑 2공장 비교해줘"처럼 기간을 좁혀서 다시 물어보셔도 좋아요.';
}

// ══ 데이터 분석 엔진 (이상 징후 · 추세 · 증감 · 순위 · 예측 · 목표 · 통계 · 종합) ══════════
// 모든 계산은 페이지에 내장된 RAW 데이터로 브라우저 안에서 수행 (외부 API 호출 없음)
const AN_GEN_M={},AN_USE_M={};
RAW.monthly_gen.forEach(r=>{AN_GEN_M[r.month]=r;});
RAW.monthly_usage.forEach(r=>{AN_USE_M[r.month]=r;});
const AN_TARGET_H=3.5;   // 발전시간 목표 (차트 기준선과 동일)
const AN_YOY_FLAG=15;    // 전년 동월 대비 ±15% 이상이면 "큰 변화"
const AN_GAP_FLAG=8;     // 두 공장의 전년비 차이가 8%p 이상이면 "공장 간 편차"
const AN_EQUIP_DEV=15;   // 1공장/2공장 발전시간 비율이 평소(±15일 중앙값)보다 15% 이상 벗어나면 "설비 의심"
let anPendingCharts=[],anChartSeq=0;

function anLastDate(){return RAW.daily[RAW.daily.length-1].date;}
function anLastYM(){return anLastDate().slice(0,7);}
function anAddM(ym,n){let[y,m]=ym.split('-').map(Number);m+=n;while(m<1){m+=12;y--;}while(m>12){m-=12;y++;}return y+'-'+String(m).padStart(2,'0');}
function anDaysIn(ym){const[y,m]=ym.split('-').map(Number);return new Date(y,m,0).getDate();}
function anComplete(ym){const r=AN_GEN_M[ym];return!!r&&r.days>=anDaysIn(ym)-1;}
function anShortYM(ym){return ym.slice(2,4)+'.'+ym.slice(5,7);}
function anMD(date){return(+date.slice(5,7))+'/'+(+date.slice(8,10));}
function anDow(date){return'일월화수목금토'[new Date(date+'T00:00:00').getDay()];}
function anMean(a){return a.length?a.reduce((p,q)=>p+q,0)/a.length:null;}
function anMedian(a){if(!a.length)return null;const s=[...a].sort((x,y)=>x-y),k=s.length>>1;return s.length%2?s[k]:(s[k-1]+s[k])/2;}
function anStd(a){if(a.length<2)return 0;const m=anMean(a);return Math.sqrt(a.reduce((s,v)=>s+(v-m)*(v-m),0)/(a.length-1));}
function anSlope(ys){const n=ys.length;if(n<2)return 0;const mx=(n-1)/2,my=anMean(ys);let num=0,den=0;ys.forEach((y,i)=>{num+=(i-mx)*(y-my);den+=(i-mx)*(i-mx);});return num/den;}
function anPct(cur,base){return cur==null||!base?null:(cur-base)/base*100;}
function anPctHtml(v,unit){if(v==null||isNaN(v))return'<span class="an-mut">-</span>';return'<span class="'+(v>=0?'an-up':'an-dn')+'">'+(v>=0?'▲':'▼')+chatFmt(Math.abs(v),1)+(unit||'%')+'</span>';}
function anTag(txt,cls){return'<span class="an-tag an-'+(cls||'info')+'">'+txt+'</span>';}
function anMetricName(m){return{gen:'발전량',hours:'발전시간',usage:'전력사용량',ratio:'태양광 사용비율'}[m];}
function anUnit(m){return{gen:'MWh',hours:'h',usage:'MWh',ratio:'%'}[m];}
function anCell(m,v){if(v==null||isNaN(v))return'-';return m==='gen'||m==='usage'?chatFmt(v/1000,1):m==='hours'?chatFmt(v,2):chatFmt(v,1);}
function anFacs(facs){return facs[0]==='all'?['all','1','2']:facs;}
// 월 단위 지표값. gen=총 kWh, genAvg=일평균 kWh, hours=평균 발전시간, usage=사용량 kWh, ratio=사용비율 %
function anMonthVal(ym,fac,metric){
  if(metric==='usage'||metric==='ratio'){const r=AN_USE_M[ym];if(!r)return null;return metric==='usage'?r['usage_'+fac]:r['ratio_'+fac];}
  const r=AN_GEN_M[ym];if(!r)return null;
  if(metric==='hours')return r['hrs_'+fac];
  if(metric==='genAvg')return r.days?r['kwh_'+fac]/r.days:null;
  return r['kwh_'+fac];
}
// 증감 비교용 값: 발전량은 일수가 다른 달(진행 중인 달 등)도 공정하게 비교되도록 일평균 기준
function anCmpVal(ym,fac,metric){return metric==='gen'?anMonthVal(ym,fac,'genAvg'):anMonthVal(ym,fac,metric);}
// 증감 표시: 사용비율은 %p 차이, 나머지는 % 변화율
function anChg(metric,ym,baseYM,fac){
  const c=anCmpVal(ym,fac,metric),b=anCmpVal(baseYM,fac,metric);
  if(c==null||b==null)return null;
  return metric==='ratio'?c-b:anPct(c,b);
}
function anChgHtml(metric,v){return anPctHtml(v,metric==='ratio'?'%p':'%');}
function anDailyField(metric){return{gen:'kwh_',hours:'hrs_',usage:'usage_',ratio:'ratio_'}[metric];}
function anDailyRows(metric,from,to){return(metric==='usage'||metric==='ratio'?RAW.usage:RAW.daily).filter(d=>d.date>=from&&d.date<=to);}
// 질문 속 기간 → {from,to,label}. 기간이 없으면 최근 defMonths개월
function anScope(periods,defMonths){
  if(periods.length){
    const p=periods[0];
    if(p.mode==='day'){const d=chatFilterDaily(p);return d.length?{from:d[0].date,to:d[0].date,label:p.label}:null;}
    const r=chatPeriodRange(p);return{from:r.from||RAW.daily[0].date,to:r.to||anLastDate(),label:p.label};
  }
  const fromYM=anAddM(anLastYM(),-(defMonths-1));
  return{from:fromYM+'-01',to:anLastDate(),label:'최근 '+defMonths+'개월'};
}
function anMonthsIn(sc){return RAW.monthly_gen.map(r=>r.month).filter(m=>m>=sc.from.slice(0,7)&&m<=sc.to.slice(0,7));}
function anStreaks(dates){
  const out=[];
  dates.forEach(dt=>{const last=out[out.length-1];if(last&&(new Date(dt)-new Date(last.to))/864e5===1){last.to=dt;last.n++;}else out.push({from:dt,to:dt,n:1});});
  return out;
}
// ── 미니 차트: 답변 HTML에 자리(div)만 넣어두고, 말풍선이 화면에 붙은 뒤 Plotly로 그린다
function anChart(traces,lay,height){

// ── 일별 이상일 탐지 ──
// 두 공장은 같은 지역이라 날씨 영향을 똑같이 받는다. 그래서
//  · 두 공장이 같이 떨어진 날            → 기상(흐림·강우) 영향
//  · 한 공장만 평소 비율에서 벗어난 날    → 설비 이상 의심 (1공장/2공장 발전시간 비율을 ±15일 중앙값과 비교)
//  · 한 공장만 발전량 0                  → 정지 또는 데이터 누락
function anDailyScan(from,to){
  const dl=RAW.daily,res={equip:[],weather:[],stop:[],high:[],days:0};
  for(let i=0;i<dl.length;i++){
    const d=dl[i];if(d.date<from||d.date>to)continue;
    res.days++;
    const win=dl.slice(Math.max(0,i-15),i+16).filter(x=>x!==d);
    const medAll=anMedian(win.map(x=>x.hrs_all));
    const relMed=anMedian(win.filter(x=>x.hrs_1>1.5&&x.hrs_2>1.5).map(x=>x.hrs_1/x.hrs_2));
    if(d.kwh_1===0||d.kwh_2===0){res.stop.push({date:d.date,fac:d.kwh_1===0&&d.kwh_2===0?'all':d.kwh_1===0?'1':'2'});continue;}
    if(relMed&&d.hrs_1>1.5&&d.hrs_2>1.5){
      const dev=(d.hrs_1/d.hrs_2/relMed-1)*100;
      if(Math.abs(dev)>=AN_EQUIP_DEV)res.equip.push({date:d.date,dev,fac:dev<0?'1':'2',h1:d.hrs_1,h2:d.hrs_2});
    }
    if(medAll&&d.hrs_all<medAll*0.6)res.weather.push({date:d.date,hrs:d.hrs_all,med:medAll});
    else if(medAll&&d.hrs_all>medAll*1.3)res.high.push({date:d.date,hrs:d.hrs_all,med:medAll});
  }
  return res;
}
// ── 공장 간 상대효율 (1공장 발전시간 ÷ 2공장 발전시간, 월별) ──
// 날씨는 두 공장에 똑같이 작용하므로 이 비율은 일정해야 정상. 계속 변하면 한쪽 설비 성능이 변하고 있다는 신호.
function anRelSummary(){
  const s=RAW.monthly_gen.filter(r=>anComplete(r.month)&&r.hrs_2>0).map(r=>({month:r.month,rel:r.hrs_1/r.hrs_2}));
  if(s.length<6)return null;
  const baseN=Math.min(12,Math.floor(s.length/2)),base=anMedian(s.slice(0,baseN).map(x=>x.rel));
  const recent=anMean(s.slice(-3).map(x=>x.rel));
  return{s,base,baseFrom:s[0].month,baseTo:s[baseN-1].month,recent,chg:anPct(recent,base),slopeY:anSlope(s.map(x=>x.rel))*12/base*100};
}
function anRelHtml(rel,withChart){
  const st=rel.chg<=-3?anTag('1공장 상대 저하','warn'):rel.chg>=3?anTag('2공장 상대 저하','warn'):anTag('정상 범위','ok');
  let h='초기('+anShortYM(rel.baseFrom)+'~'+anShortYM(rel.baseTo)+') <b>'+rel.base.toFixed(3)+'</b> → 최근 3개월 <b>'+rel.recent.toFixed(3)+'</b> '+anPctHtml(rel.chg)+' '+st
    +'<br><span class="an-note">연간 추세 '+(rel.slopeY>=0?'+':'−')+chatFmt(Math.abs(rel.slopeY),1)+'%/년 · 1.000보다 작으면 1공장 발전시간이 2공장보다 짧다는 뜻</span>';
  if(withChart){
    const xs=rel.s.map(x=>x.month);
    h+=anChart([
      {x:xs,y:rel.s.map(x=>+x.rel.toFixed(3)),type:'scatter',mode:'lines+markers',name:'1공장÷2공장',line:{color:'#38bdf8',width:2},marker:{size:4},hovertemplate:'%{x}: %{y:.3f}<extra></extra>'},
      {x:[xs[0],xs[xs.length-1]],y:[rel.base,rel.base],type:'scatter',mode:'lines',name:'초기 기준 '+rel.base.toFixed(3),line:{color:'#fbbf24',width:1.5,dash:'dash'},hoverinfo:'skip'}
    ],{xaxis:{type:'category',nticks:8}},170);
  }
  return h;
}

// ① 이상 징후 점검: "특별하게 감소/증가한 이슈 있어?"
function anIssueReport(text,periods){
  const metric=/사용량|전력\s*사용|전기\s*사용/.test(text)?'usage':/발전\s*시간/.test(text)?'hours':'gen';
  const mSc=anScope(periods,12),dSc=periods.length?mSc:anScope([],3);
  if(!mSc)return'해당 기간 데이터가 없어요.';
  const months=anMonthsIn(mSc);
  const both=[],gap=[],big=[];
  let h='<b>🔍 1·2공장 '+anMetricName(metric)+' 이상 징후 점검</b><br><span class="an-note">월별: '+mSc.label+' · 일별: '+dSc.label+' · 계절 영향을 빼기 위해 전년 동월 대비로 판단</span>';
  h+='<h4>① 월별 전년 동월 대비 ('+anUnit(metric)+')</h4><table class="an-tbl"><tr><th>월</th><th>1공장</th><th>전년비</th><th>2공장</th><th>전년비</th><th>판정</th></tr>';
  months.forEach(m=>{
    const v1=anMonthVal(m,'1',metric),v2=anMonthVal(m,'2',metric);
    const y1=anChg(metric,m,anAddM(m,-12),'1'),y2=anChg(metric,m,anAddM(m,-12),'2');
    let verdict='<span class="an-mut">정상</span>',flag=false;
    if(y1==null||y2==null)verdict='<span class="an-mut">비교불가</span>';
    else if(metric==='usage'){
      if(Math.abs(y1)>=AN_YOY_FLAG||Math.abs(y2)>=AN_YOY_FLAG){flag=true;verdict=anTag('사용량 급변','warn');big.push({m,y1,y2});}
    }else if(Math.abs(y1-y2)>=AN_GAP_FLAG){flag=true;verdict=anTag('공장 편차','warn');gap.push({m,y1,y2});}
    else if(Math.abs(y1)>=AN_YOY_FLAG||Math.abs(y2)>=AN_YOY_FLAG){flag=true;verdict=anTag(y1<0?'동반 감소':'동반 증가','info');both.push({m,y1,y2});}
    h+='<tr'+(flag?' class="an-flag"':'')+'><td>'+anShortYM(m)+(anComplete(m)?'':'*')+'</td><td>'+anCell(metric,v1)+'</td><td>'+anChgHtml(metric,y1)+'</td><td>'+anCell(metric,v2)+'</td><td>'+anChgHtml(metric,y2)+'</td><td>'+verdict+'</td></tr>';
  });
  h+='</table><span class="an-note">공장 편차: 두 공장 전년비 차이 '+AN_GAP_FLAG+'%p 이상(날씨로 설명 안 됨) · 동반 증감: 두 공장 모두 ±'+AN_YOY_FLAG+'% 이상(일사량 영향)</span>';

  const rel=anRelSummary();
  if(rel&&metric!=='usage')h+='<h4>② 공장 간 상대효율 (1공장 ÷ 2공장 발전시간)</h4>'+anRelHtml(rel,true);

  const sc=anDailyScan(dSc.from,dSc.to);
  h+='<h4>'+(metric==='usage'?'②':'③')+' 일별 이상일 ('+dSc.label+', '+sc.days+'일)</h4>';
  if(sc.stop.length)h+='⛔ <b>발전 0 (정지/데이터 누락)</b>: '+sc.stop.map(s=>anMD(s.date)+'('+anDow(s.date)+') '+chatFactoryLabel(s.fac)).join(', ')+'<br>';
  if(sc.equip.length){
    const top=[...sc.equip].sort((a,b)=>Math.abs(b.dev)-Math.abs(a.dev)).slice(0,8).sort((a,b)=>a.date<b.date?-1:1);
    h+='⚠ <b>설비 이상 의심 '+sc.equip.length+'일</b> <span class="an-note">(한 공장만 평소 대비 저조)</span><table class="an-tbl"><tr><th>날짜</th><th>1공장 h</th><th>2공장 h</th><th>평소 비율 대비</th><th>저조 공장</th></tr>'
      +top.map(e=>'<tr><td>'+anMD(e.date)+'('+anDow(e.date)+')</td><td>'+e.h1.toFixed(2)+'</td><td>'+e.h2.toFixed(2)+'</td><td>'+anPctHtml(e.dev)+'</td><td>'+chatFactoryLabel(e.fac)+'</td></tr>').join('')+'</table>';
    if(sc.equip.length>top.length)h+='<span class="an-note">편차가 큰 상위 '+top.length+'일만 표시</span><br>';
  }else h+='✅ 한 공장만 떨어진 날(설비 의심) 없음<br>';
  const wst=anStreaks(sc.weather.map(w=>w.date)),longW=wst.filter(s=>s.n>=2);
  h+='☁ <b>양 공장 동반 저조 '+sc.weather.length+'일</b> <span class="an-note">(평소의 60% 미만 → 흐림·강우 추정)</span>';
  if(longW.length)h+='<br>&nbsp;&nbsp;연속 저조: '+longW.map(s=>anMD(s.from)+'~'+anMD(s.to)+' ('+s.n+'일)').join(', ');
  h+='<br>☀ 평소보다 30% 이상 높은 날 '+sc.high.length+'일';
  if(metric!=='usage'){
    const dd=RAW.daily.filter(d=>d.date>=dSc.from&&d.date<=dSc.to),mark=new Set(sc.equip.map(e=>e.date).concat(sc.stop.map(s=>s.date)));
    const md=dd.filter(d=>mark.has(d.date));
    h+=anChart([
      {x:dd.map(d=>d.date),y:dd.map(d=>d.hrs_1),type:'scatter',mode:'lines',name:'1공장',line:{color:'#2dd4bf',width:1.3},hovertemplate:'%{x}<br>1공장 %{y:.2f}h<extra></extra>'},
      {x:dd.map(d=>d.date),y:dd.map(d=>d.hrs_2),type:'scatter',mode:'lines',name:'2공장',line:{color:'#f59e0b',width:1.3},hovertemplate:'%{x}<br>2공장 %{y:.2f}h<extra></extra>'},
      {x:md.map(d=>d.date),y:md.map(d=>Math.min(d.hrs_1,d.hrs_2)),type:'scatter',mode:'markers',name:'이상 의심',marker:{color:'#f87171',size:8,symbol:'x'},hovertemplate:'%{x} 이상 의심<extra></extra>'}
    ],{xaxis:{type:'date'},yaxis:{title:{text:'h',font:{size:9}}}},170);
  }

  // 종합 의견
  const ops=[];
  if(gap.length){
    const gm=new Set(gap.map(g=>g.m)),z=RAW.daily.filter(d=>gm.has(d.date.slice(0,7))&&(d.kwh_1===0||d.kwh_2===0));
    ops.push('<b>공장 간 편차 '+gap.length+'개월</b> ('+gap.map(g=>anShortYM(g.m)).join(', ')+'): 날씨는 두 공장에 똑같이 작용하므로, 한 공장만 다르게 움직인 달은 <b>설비 요인</b>(오염·음영·인버터·정지)을 점검할 필요가 있어요.'
      +(z.length?' 이 중 발전 0인 날: '+z.map(d=>d.date+' '+(d.kwh_1===0?'1공장':'2공장')).join(', ')+'.':''));
  }
  if(both.length)ops.push('<b>동반 증감 '+both.length+'개월</b> ('+both.map(g=>anShortYM(g.m)+' '+(g.y1<0?'↓':'↑')).join(', ')+'): 두 공장이 같이 움직였으므로 <b>일사량(기상) 차이</b>로 판단돼요.');
  if(big.length){
    ops.push('전력사용량이 전년 대비 ±'+AN_YOY_FLAG+'% 이상 바뀐 달: '+big.map(g=>anShortYM(g.m)).join(', ')+' — 생산량·설비 가동 변화 여부 확인 필요.');
    const huge=big.filter(g=>Math.abs(g.y1)>=100||Math.abs(g.y2)>=100);
    if(huge.length)ops.push('전년 대비 2배 이상 차이 나는 달('+huge.map(g=>anShortYM(g.m)).join(', ')+')은 실제 사용 변화보다 <b>계량 범위(검침 대상) 변경</b>일 가능성이 높아요.');
  }
  if(rel&&metric!=='usage'&&Math.abs(rel.chg)>=3)ops.push('<b>상대효율 '+(rel.chg<0?'하락':'상승')+'</b>: 1공장÷2공장 비율이 초기 대비 '+chatFmt(Math.abs(rel.chg),1)+'% '+(rel.chg<0?'낮아졌어요. 1공장 발전 성능 저하(모듈 오염·열화, 인버터 효율) 또는 2공장 개선(세척 등) 가능성이 있어요. 1공장 모듈 세척·인버터 점검을 권장해요.':'높아졌어요. 2공장 쪽 성능 저하 가능성을 점검해보세요.'));
  if(sc.stop.length)ops.push('<b>발전 0인 날</b> '+sc.stop.map(s=>s.date+' '+chatFactoryLabel(s.fac)).join(', ')+' — 정지 사유 또는 데이터 누락 여부 확인 필요.');
  if(sc.equip.length){const c1=sc.equip.filter(e=>e.fac==='1').length;ops.push('최근 일별 설비 의심일은 '+sc.equip.length+'일이며 '+(c1>=sc.equip.length-c1?'1공장':'2공장')+' 쪽이 더 많아요.');}
  if(longW.length){const L=longW.reduce((a,b)=>b.n>=a.n?b:a);ops.push('가장 긴 저조 구간은 '+anMD(L.from)+'~'+anMD(L.to)+' ('+L.n+'일 연속, 양 공장 동반)으로 기상 영향으로 보여요.');}
  if(!ops.length)ops.push('뚜렷한 이상 징후는 보이지 않아요.');
  h+='<h4>'+(metric==='usage'?'③':'④')+' 종합 의견</h4><div class="an-box">'+ops.map(o=>'· '+o).join('<br>')+'</div>';
  return h;
}

// ② 전월·전년 동월 대비 증감
function anYtd(ym,fac){
  const y=ym.slice(0,4),to=ym===anLastYM()?anLastDate():ym+'-31',pFrom=(+y-1)+'-01-01',pTo=(+y-1)+to.slice(4);
  const cur=RAW.daily.filter(d=>d.date>=y+'-01-01'&&d.date<=to),prev=RAW.daily.filter(d=>d.date>=pFrom&&d.date<=pTo);
  const cv=cur.reduce((s,d)=>s+d['kwh_'+fac],0),pv=prev.reduce((s,d)=>s+d['kwh_'+fac],0);
  return{cv,pv,pct:prev.length>=cur.length*0.9?anPct(cv,pv):null,partialPrev:prev.length<cur.length*0.9,curDays:cur.length,prevDays:prev.length,label:(+y)+'년 1월~'+(+to.slice(5,7))+'월'};
}
function anSameMonthRank(ym,fac){
  const mm=ym.slice(5),arr=RAW.monthly_gen.filter(r=>r.month.slice(5)===mm&&anComplete(r.month)).map(r=>({m:r.month,v:r['kwh_'+fac]})).sort((a,b)=>b.v-a.v);
  const i=arr.findIndex(x=>x.m===ym);
  return i<0?null:{rank:i+1,n:arr.length};
}
function anChangeReport(text,periods,facs,metrics){
  const mp=periods.find(p=>p.mode==='month'),ym=mp?mp.ym:anLastYM();
  if(!AN_GEN_M[ym])return chatMonthLabel(ym)+' 데이터가 없어요.';
  const fl=anFacs(facs),ms=metrics.length?metrics:['gen','hours','ratio','usage'];
  let h='<b>↕ '+chatMonthLabel(ym)+' 전월 · 전년 동월 대비 증감</b>';
  if(!anComplete(ym))h+='<br><span class="an-note">* 진행 중인 달('+AN_GEN_M[ym].days+'일) — 발전량은 일평균 기준으로 비교</span>';
  ms.forEach(m=>{
    h+='<h4>'+anMetricName(m)+' ('+anUnit(m)+')</h4><table class="an-tbl"><tr><th>구분</th><th>당월</th><th>전월</th><th>전월비</th><th>전년 동월</th><th>전년비</th></tr>';
    fl.forEach(f=>{
      h+='<tr><td>'+chatFactoryLabel(f)+'</td><td><b>'+anCell(m,anMonthVal(ym,f,m))+'</b></td><td>'+anCell(m,anMonthVal(anAddM(ym,-1),f,m))+'</td><td>'+anChgHtml(m,anChg(m,ym,anAddM(ym,-1),f))+'</td><td>'+anCell(m,anMonthVal(anAddM(ym,-12),f,m))+'</td><td>'+anChgHtml(m,anChg(m,ym,anAddM(ym,-12),f))+'</td></tr>';
    });
    h+='</table>';
  });
  const notes=[];
  fl.forEach(f=>{
    const yt=anYtd(ym,f);
    notes.push(chatFactoryLabel(f)+' 연간 누적('+yt.label+'): <b>'+chatFmt(yt.cv/1000,1)+'MWh</b>'+(yt.pct!=null?' · 전년 동기 '+chatFmt(yt.pv/1000,1)+'MWh 대비 '+anPctHtml(yt.pct):' <span class="an-note">(전년 동기 데이터 부족)</span>'));
  });
  const rk=anSameMonthRank(ym,'all');
  if(rk&&rk.n>1)notes.push((+ym.slice(5))+'월 발전량 기준 데이터가 있는 '+rk.n+'개 연도 중 <b>'+rk.rank+'위</b>');
  const y1=anChg('gen',ym,anAddM(ym,-12),'1'),y2=anChg('gen',ym,anAddM(ym,-12),'2');
  if(y1!=null&&y2!=null){
    if(Math.abs(y1-y2)>=AN_GAP_FLAG)notes.push('⚠ 두 공장의 전년비 차이가 '+chatFmt(Math.abs(y1-y2),1)+'%p로 커요 → 날씨보다 <b>설비 요인</b> 가능성. "이상 징후 점검해줘"로 자세히 확인해보세요.');
    else notes.push('두 공장 전년비가 비슷하게 움직였어요('+chatFmt(y1,1)+'% / '+chatFmt(y2,1)+'%) → 증감은 주로 <b>일사량(기상)</b> 영향으로 보여요.');
  }
  return h+'<div class="an-box">'+notes.map(n=>'· '+n).join('<br>')+'</div>';
}

// ③ 추세 분석
function anTrendReport(text,periods,facs,metrics){
  const m=metrics[0]||'gen',f=facs.length===1?facs[0]:'all';
  const sc=periods.length?anScope(periods,12):{from:RAW.daily[0].date,to:anLastDate(),label:'전체 기간'};
  if(!sc)return'해당 기간 데이터가 없어요.';
  const months=anMonthsIn(sc).filter(anComplete);
  if(months.length<3)return'추세를 보려면 완전한 달이 3개월 이상 필요해요.';
  const vals=months.map(x=>anMonthVal(x,f,m));
  let h='<b>📈 '+chatFactoryLabel(f)+' '+anMetricName(m)+' 추세 분석</b><br><span class="an-note">'+sc.label+' · 완전한 달 '+months.length+'개월 기준</span>';
  // 최근 6개월 전년 동월 대비
  const rec=months.slice(-6).map(x=>({m:x,v:anMonthVal(x,f,m),pv:anMonthVal(anAddM(x,-12),f,m),c:anChg(m,x,anAddM(x,-12),f)}));
  h+='<h4>최근 6개월 전년 동월 대비 ('+anUnit(m)+')</h4><table class="an-tbl"><tr><th>월</th><th>올해</th><th>전년</th><th>전년비</th></tr>'
    +rec.map(r=>'<tr><td>'+anShortYM(r.m)+'</td><td>'+anCell(m,r.v)+'</td><td>'+anCell(m,r.pv)+'</td><td>'+anChgHtml(m,r.c)+'</td></tr>').join('')+'</table>';
  const cs=rec.map(r=>r.c).filter(v=>v!=null),avgC=anMean(cs);
  const ops=[];
  if(avgC!=null){
    const up=cs.filter(v=>v>0).length;
    const dir=avgC>3?'증가 추세':avgC<-3?'감소 추세':'보합(큰 변화 없음)';
    ops.push('최근 '+cs.length+'개월 전년비 평균 <b>'+(avgC>=0?'+':'')+chatFmt(avgC,1)+(m==='ratio'?'%p':'%')+'</b> → <b>'+dir+'</b> (증가 '+up+'개월 / 감소 '+(cs.length-up)+'개월)');
  }
  // 12개월 이동합계(계절성 제거)
  if(months.length>=13){
    const agg=a=>m==='gen'||m==='usage'?a.reduce((p,q)=>p+q,0):anMean(a);
    const r1=agg(vals.slice(-24,-12).length===12?vals.slice(-24,-12):vals.slice(0,12)),r2=agg(vals.slice(-12));
    const lbl1=vals.slice(-24,-12).length===12?anShortYM(months[months.length-24])+'~'+anShortYM(months[months.length-13]):anShortYM(months[0])+'~'+anShortYM(months[11]);
    ops.push('직전 12개월('+anShortYM(months[months.length-12])+'~'+anShortYM(months[months.length-1])+') '+(m==='gen'||m==='usage'?'합계':'평균')+' <b>'+anCell(m,r2)+anUnit(m)+'</b> vs 그 이전 12개월('+lbl1+') '+anCell(m,r1)+anUnit(m)+' → '+anChgHtml(m,m==='ratio'?r2-r1:anPct(r2,r1)));
  }
  const iMax=vals.indexOf(Math.max(...vals)),iMin=vals.indexOf(Math.min(...vals));
  ops.push('최고: '+chatMonthLabel(months[iMax])+' '+anCell(m,vals[iMax])+anUnit(m)+' · 최저: '+chatMonthLabel(months[iMin])+' '+anCell(m,vals[iMin])+anUnit(m));
  if(m==='gen'||m==='hours'){const rel=anRelSummary();if(rel&&Math.abs(rel.chg)>=3)ops.push('참고: 1공장÷2공장 발전시간 비율이 초기 대비 '+anPctHtml(rel.chg)+' — 공장 간 성능 차이가 벌어지고 있어요.');}
  h+='<div class="an-box">'+ops.map(o=>'· '+o).join('<br>')+'</div>';
  // 연도별 겹쳐 보기
  const years=[...new Set(months.map(x=>x.slice(0,4)))],colors=['#475569','#64748b','#94a3b8','#38bdf8','#2dd4bf'].slice(-years.length);
  h+=anChart(years.map((y,i)=>{const ym=months.filter(x=>x.slice(0,4)===y);return{x:ym.map(x=>(+x.slice(5))+'월'),y:ym.map(x=>{const v=anMonthVal(x,f,m);return m==='gen'||m==='usage'?v/1000:v;}),type:'scatter',mode:'lines+markers',name:y+'년',line:{color:colors[i]||'#38bdf8',width:i===years.length-1?2.5:1.5},marker:{size:4},hovertemplate:y+'년 %{x}: %{y:,.1f}'+anUnit(m)+'<extra></extra>'};}),
    {xaxis:{type:'category',categoryorder:'array',categoryarray:[...Array(12)].map((_,i)=>(i+1)+'월')},yaxis:{title:{text:anUnit(m),font:{size:9}}}},180);
  return h;
}

// ④ 순위 (최고/최저 날·주·달)
function anRankReport(text,periods,facs,metrics){
  const m=metrics[0]||'gen',fl=facs.length===2?facs:[facs[0]];
  const asc=/최저|최소|적[게은었]|낮[은았게]|하위|워스트|나빴|나쁜|저조|안\s*좋/.test(text);
  const t2=text.replace(CHAT_PERIOD_RE,' ');   // '이번달' 같은 기간 표현은 단위 판단에서 제외
  const adj='(?:많은|적은|높은|낮은|좋은|나쁜|많이\\s*나온|적게\\s*나온)\\s*';
  const unit=new RegExp('주간|주차|어느\\s*주|몇\\s*주|주\\s*단위|'+adj+'주(?![가-힣])').test(t2)?'week'
    :new RegExp('달|월별|월간|어느\\s*월|몇\\s*월|'+adj+'월').test(t2)?'month':'day';
  const nm=text.match(/(?:top|탑|상위|하위)\s*(\d+)|(\d+)\s*(?:개|위|순위)/i),n=Math.min(15,Math.max(1,nm?+(nm[1]||nm[2]):5));
  const sc=periods.length?anScope(periods,12):{from:RAW.daily[0].date,to:anLastDate(),label:'전체 기간'};
  if(!sc)return'해당 기간 데이터가 없어요.';
  const unitKo={day:'날',week:'주',month:'달'}[unit];
  let h='<b>🏆 '+anMetricName(m)+' '+(asc?'낮은':'높은')+' '+unitKo+' '+(asc?'하위':'상위')+' '+n+'</b><br><span class="an-note">'+sc.label+(unit==='month'?' · 진행 중인 달 제외':'')+'</span>';
  fl.forEach(f=>{
    let rows;
    if(unit==='day')rows=anDailyRows(m,sc.from,sc.to).map(d=>({k:d.date+'('+anDow(d.date)+')',v:d[anDailyField(m)+f]}));
    else if(unit==='month')rows=anMonthsIn(sc).filter(anComplete).map(x=>({k:chatMonthLabel(x),v:anMonthVal(x,f,m)}));
    else{const arr=m==='usage'||m==='ratio'?RAW.weekly_usage:RAW.weekly_gen;rows=arr.filter(w=>w.week_start>=sc.from&&w.week_start<=sc.to).map(w=>({k:w.week_start+' 주',v:w[anDailyField(m)+f]}));}
    rows=rows.filter(r=>r.v!=null&&!isNaN(r.v));
    if(!rows.length){h+='<br>'+chatFactoryLabel(f)+': 데이터 없음';return;}
    const avg=anMean(rows.map(r=>r.v));
    const top=[...rows].sort((a,b)=>asc?a.v-b.v:b.v-a.v).slice(0,n);
    const fmtV=v=>m==='gen'||m==='usage'?(unit==='day'?chatFmt(v,0)+'kWh':chatFmt(v/1000,1)+'MWh'):m==='hours'?chatFmt(v,2)+'h':chatFmt(v,1)+'%';
    h+='<h4>'+chatFactoryLabel(f)+' <span class="an-note">(평균 '+fmtV(avg)+')</span></h4><table class="an-tbl"><tr><th>순위</th><th>기간</th><th>값</th><th>평균 대비</th></tr>'
      +top.map((r,i)=>'<tr><td>'+(i+1)+'</td><td style="text-align:left">'+r.k+'</td><td>'+fmtV(r.v)+'</td><td>'+anPctHtml(anPct(r.v,avg))+'</td></tr>').join('')+'</table>';
  });
  return h;
}

// ⑤ 예측 (과거 동월 평균 × 최근 실적 보정계수)
function anSameMonthBase(ym,fac){
  const mm=ym.slice(5),a=RAW.monthly_gen.filter(r=>r.month.slice(5)===mm&&r.month<ym&&anComplete(r.month)).map(r=>r['kwh_'+fac]);
  return a.length?anMean(a):null;
}
function anFactors(fac,k){
  const done=RAW.monthly_gen.map(r=>r.month).filter(anComplete);
  return done.slice(-k).map(m=>{const b=anSameMonthBase(m,fac);return b?anMonthVal(m,fac,'gen')/b:null;}).filter(v=>v!=null);
}
function anForecast(text,facs){
  const last=anLastYM(),partial=!anComplete(last);
  const target=partial&&!/다음\s*달|내달|익월/.test(text)?last:anAddM(last,1);
  const fl=anFacs(facs);
  let h='<b>🔮 '+chatMonthLabel(target)+' 발전량 예측</b><br><span class="an-note">방법: 과거 같은 달 평균 × 최근 3개월 실적/평년 비율 (범위는 최근 6개월 비율의 최소~최대)</span>';
  h+='<table class="an-tbl"><tr><th>구분</th><th>예상(MWh)</th><th>범위</th><th>전년 동월</th></tr>';
  const est={};
  fl.forEach(f=>{
    const base=anSameMonthBase(target,f),fs=anFactors(f,3),fs6=anFactors(f,6);
    if(!base||!fs.length){h+='<tr><td>'+chatFactoryLabel(f)+'</td><td colspan="3">과거 동월 데이터 부족</td></tr>';return;}
    const k=anMedian(fs),lo=Math.min(...fs6),hi=Math.max(...fs6);
    let e=base*k,eLo=base*lo,eHi=base*hi;
    if(target===last&&partial){   // 진행 중인 달: 실적 + 남은 일수 추정
      const r=AN_GEN_M[last],rem=anDaysIn(last)-r.days,per=base/anDaysIn(last);
      e=r['kwh_'+f]+rem*per*k;eLo=r['kwh_'+f]+rem*per*lo;eHi=r['kwh_'+f]+rem*per*hi;
    }
    est[f]={e,k};
    h+='<tr><td>'+chatFactoryLabel(f)+'</td><td><b>'+chatFmt(e/1000,1)+'</b></td><td>'+chatFmt(eLo/1000,1)+'~'+chatFmt(eHi/1000,1)+'</td><td>'+anCell('gen',anMonthVal(anAddM(target,-12),f,'gen'))+'</td></tr>';
  });
  h+='</table>';
  const f0=fl[0];
  if(est[f0]){
    const notes=['최근 3개월 실적은 평년(과거 같은 달 평균)의 <b>'+chatFmt(est[f0].k*100,0)+'%</b> 수준이에요.'];
    // 연말 누적 전망
    {
      const y=target.slice(0,4);let ytd=0,rest=0,ok=true;
      RAW.monthly_gen.filter(r=>r.month.slice(0,4)===y&&r.month<target).forEach(r=>{ytd+=r['kwh_'+f0];});
      for(let mm=target;mm.slice(0,4)===y;mm=anAddM(mm,1)){
        if(mm===target){rest+=est[f0].e;continue;}
        const b=anSameMonthBase(mm,f0);if(!b){ok=false;break;}rest+=b*est[f0].k;
      }
      const py=String(+y-1),pyTot=RAW.monthly_gen.filter(r=>r.month.slice(0,4)===py).reduce((s,r)=>s+r['kwh_'+f0],0),pyFull=RAW.monthly_gen.filter(r=>r.month.slice(0,4)===py&&anComplete(r.month)).length===12;
      if(ok)notes.push(chatFactoryLabel(f0)+' '+y+'년 연간 예상 <b>'+chatFmt((ytd+rest)/1000,1)+'MWh</b> (실적 '+chatFmt(ytd/1000,1)+' + 남은 기간 예상 '+chatFmt(rest/1000,1)+')'+(pyFull?' · 전년 '+chatFmt(pyTot/1000,1)+'MWh 대비 '+anPctHtml(anPct(ytd+rest,pyTot)):''));
    }
    notes.push('<span class="an-note">날씨에 따라 실제 값은 범위를 벗어날 수 있어요. 참고용 추정치예요.</span>');
    h+='<div class="an-box">'+notes.map(n=>'· '+n).join('<br>')+'</div>';
  }
  return h;
}

// ⑦ 기초 통계 (일별 분포)

// ⑧ 요일별 패턴 (사용량·사용비율)
function anWeekdayReport(text,periods,facs){
  const f=facs.length===1?facs[0]:'all',sc=anScope(periods,3);
  if(!sc)return'해당 기간 데이터가 없어요.';

  if(!rows.length)return sc.label+' 데이터가 없어요.';
  const by=[...Array(7)].map(()=>({u:[],s:[]}));
  rows.forEach(d=>{const w=new Date(d.date+'T00:00:00').getDay();by[w].u.push(d['usage_'+f]);by[w].s.push(d['solar_'+f]);});
  const order=[1,2,3,4,5,6,0];
  let h='<b>📅 '+chatFactoryLabel(f)+' 요일별 패턴</b><br><span class="an-note">'+sc.label+' ('+rows.length+'일)</span><table class="an-tbl"><tr><th>요일</th><th>평균 사용량(MWh)</th><th>평균 발전량(MWh)</th><th>사용비율</th></tr>';
  order.forEach(w=>{const b=by[w];if(!b.u.length)return;const su=b.u.reduce((p,q)=>p+q,0),ss=b.s.reduce((p,q)=>p+q,0);
    h+='<tr><td>'+'일월화수목금토'[w]+'</td><td>'+chatFmt(su/b.u.length/1000,1)+'</td><td>'+chatFmt(ss/b.s.length/1000,1)+'</td><td>'+chatFmt(su?ss/su*100:0,1)+'%</td></tr>';});
  const wk=[1,2,3,4,5].flatMap(w=>by[w].u),we=[0,6].flatMap(w=>by[w].u);
  h+='</table>';
  if(wk.length&&we.length)h+='<div class="an-box">· 주말 평균 사용량은 평일의 <b>'+chatFmt(anMean(we)/anMean(wk)*100,0)+'%</b> 수준이에요. 발전량은 요일과 무관하므로 사용량이 적은 주말에 사용비율이 높아져요.</div>';
  return h;
}

// ⑨ 월간 종합 분석
function anSummaryReport(text,periods,facs){
  const mp=periods.find(p=>p.mode==='month'),ym=mp?mp.ym:anLastYM(),g=AN_GEN_M[ym];
  if(!g)return chatMonthLabel(ym)+' 데이터가 없어요.';
  const partial=!anComplete(ym),pm=anAddM(ym,-1),py=anAddM(ym,-12);
  let h='<b>📋 '+chatMonthLabel(ym)+' 태양광 종합 분석</b>'+(partial?' <span class="an-note">(진행 중, '+g.days+'일 · 발전량 증감은 일평균 기준)</span>':'');
  h+='<h4>① 핵심 지표</h4><table class="an-tbl"><tr><th>구분</th><th>발전량(MWh)</th><th>전월비</th><th>전년비</th><th>발전시간</th><th>사용비율</th></tr>';
  ['all','1','2'].forEach(f=>{
    h+='<tr><td>'+chatFactoryLabel(f)+'</td><td><b>'+anCell('gen',anMonthVal(ym,f,'gen'))+'</b></td><td>'+anChgHtml('gen',anChg('gen',ym,pm,f))+'</td><td>'+anChgHtml('gen',anChg('gen',ym,py,f))+'</td><td>'+anCell('hours',anMonthVal(ym,f,'hours'))+'h</td><td>'+anCell('ratio',anMonthVal(ym,f,'ratio'))+'%</td></tr>';
  });
  h+='</table>';
  const yt=anYtd(ym,'all');
  h+='<span class="an-note">연간 누적('+yt.label+') '+chatFmt(yt.cv/1000,1)+'MWh'+(yt.pct!=null?' · 전년 동기 대비 ':'')+'</span>'+(yt.pct!=null?anPctHtml(yt.pct):'');
  const dd=RAW.daily.filter(d=>d.date.slice(0,7)===ym),sc=anDailyScan(ym+'-01',ym+'-31');
  const best=dd.reduce((p,q)=>q.kwh_all>p.kwh_all?q:p),worst=dd.reduce((p,q)=>q.kwh_all<p.kwh_all?q:p);
  const tgt=dd.filter(d=>d.hrs_all>=AN_TARGET_H).length;
  h+='<h4>② 일별 특징</h4>· 최고 '+anMD(best.date)+'('+anDow(best.date)+') '+chatFmt(best.kwh_all,0)+'kWh · 최저 '+anMD(worst.date)+'('+anDow(worst.date)+') '+chatFmt(worst.kwh_all,0)+'kWh'
    +'<br>· 목표 '+AN_TARGET_H+'h 달성일 <b>'+tgt+'/'+dd.length+'일</b> ('+chatFmt(tgt/dd.length*100,0)+'%)'
    +'<br>· 기상 영향 저조일 '+sc.weather.length+'일'+(()=>{const L=anStreaks(sc.weather.map(w=>w.date)).filter(s=>s.n>=2);return L.length?' (연속: '+L.map(s=>anMD(s.from)+'~'+anMD(s.to)).join(', ')+')':'';})()
    +' · 설비 의심일 '+(sc.equip.length?anTag(sc.equip.length+'일','warn'):anTag('없음','ok'))+(sc.stop.length?' · 발전 0: '+sc.stop.map(s=>anMD(s.date)+' '+chatFactoryLabel(s.fac)).join(', '):'');
  const pAvg=anMonthVal(py,'all','genAvg'),avg=anMean(dd.map(d=>d.kwh_all));
  h+=anChart([
    {x:dd.map(d=>d.date),y:dd.map(d=>d.kwh_all),type:'bar',name:'일 발전량',marker:{color:dd.map(d=>sc.equip.some(e=>e.date===d.date)||sc.stop.some(s=>s.date===d.date)?'#f87171':sc.weather.some(w=>w.date===d.date)?'#64748b':'#2dd4bf')},hovertemplate:'%{x}: %{y:,.0f}kWh<extra></extra>'},
    {x:[dd[0].date,dd[dd.length-1].date],y:[avg,avg],type:'scatter',mode:'lines',name:'당월 평균',line:{color:'#2dd4bf',width:1.5,dash:'dot'},hoverinfo:'skip'}
  ].concat(pAvg?[{x:[dd[0].date,dd[dd.length-1].date],y:[pAvg,pAvg],type:'scatter',mode:'lines',name:'전년 동월 평균',line:{color:'#fbbf24',width:1.5,dash:'dash'},hoverinfo:'skip'}]:[]),
    {xaxis:{type:'date'},yaxis:{title:{text:'kWh',font:{size:9}}},bargap:0.15},170);
  h+='<span class="an-note">회색 막대: 기상 영향 저조일 · 빨간 막대: 설비 의심/정지</span>';
  // 인사이트
  const ops=[],y1=anChg('gen',ym,py,'1'),y2=anChg('gen',ym,py,'2'),ya=anChg('gen',ym,py,'all');
  if(ya!=null){
    if(y1!=null&&y2!=null&&Math.abs(y1-y2)>=AN_GAP_FLAG)ops.push('전년 동월 대비 1공장 '+anPctHtml(y1)+', 2공장 '+anPctHtml(y2)+' — 공장 간 차이가 커서 <b>설비 요인 점검</b>이 필요해요.');
    else ops.push('전년 동월 대비 '+anPctHtml(ya)+' — 두 공장이 비슷하게 움직여 <b>일사량(기상) 영향</b>으로 보여요.');
  }
  const rk=anSameMonthRank(ym,'all');if(rk&&rk.n>1)ops.push((+ym.slice(5))+'월 기준 '+rk.n+'개 연도 중 '+rk.rank+'위');
  const rel=anRelSummary();if(rel)ops.push('공장 간 상대효율(1공장÷2공장) '+rel.recent.toFixed(3)+' — 초기 '+rel.base.toFixed(3)+' 대비 '+anPctHtml(rel.chg)+(Math.abs(rel.chg)>=3?' '+anTag(rel.chg<0?'1공장 점검 권장':'2공장 점검 권장','warn'):' '+anTag('정상','ok')));
  const rU=anChg('usage',ym,py,'all');if(rU!=null)ops.push('전력사용량 전년비 '+anPctHtml(rU)+', 사용비율 '+anChgHtml('ratio',anChg('ratio',ym,py,'all')));
  h+='<h4>③ 핵심 인사이트</h4><div class="an-box">'+ops.map(o=>'· '+o).join('<br>')+'</div><span class="an-note">더 보기: "이상 징후 점검해줘", "추세 분석해줘", "다음달 예측해줘"</span>';
  return h;
}

function chatAnswer(text){
  if(!RAW.daily.length)return'데이터가 없습니다.';
  if(/도움말|help|예시/i.test(text))return'이렇게 물어보세요:<br>'+CHAT_EXAMPLES.map(e=>'· '+e).join('<br>');
  if(/^\s*(안녕|반가워|하이|hi|hello)/i.test(text))return'안녕하세요! 발전량 데이터에 대해 물어보세요. "도움말"이라고 입력하면 예시를 볼 수 있어요.';
  if(/고마워|감사합니다|고맙습니다/.test(text))return'네, 도움이 되었다면 좋겠네요 :)';
  // "합산이야?" 같은 방법론 질문은 다른 신호(공장명 등)와 무관하게 항상 먼저 직접 답한다
  if(/합산|합계(?!금)|더한\s*거|총합/.test(text)&&/(이야|인가|맞|뭐|무슨)/.test(text))return'"전체"로 표시되는 숫자는 1공장 + 2공장을 합산한 값이에요. 공장별로 따로 보려면 "1공장 발전량"처럼 공장을 지정해서 물어보세요.';

  // "왜 차이나?" 같은 후속 질문: 직전에 조회했던 기간/공장/지표를 그대로 이어받아 분석
  if(chatIsWhyFollowup(text)){
    if(!chatLastCtx)return'어떤 것에 대한 질문인지 모르겠어요. 예: "1공장이랑 2공장 비교해줘"처럼 먼저 비교를 물어본 다음에 "왜 차이나?"라고 물어봐 주세요.';
    if(chatLastCtx.facs.length===2&&chatLastCtx.periods.length===1)return chatWhyFactoryAnswer();
    if(chatLastCtx.periods.length===2&&chatLastCtx.facs.length===1)return chatWhyPeriodAnswer();
    return'지금은 "공장 두 곳 비교" 또는 "기간 두 곳 비교" 뒤에만 "왜" 질문에 답할 수 있어요. 예: "1공장이랑 2공장 비교해줘" 다음에 "왜 차이나?"처럼요.';
  }

  // ── 분석형 질문 라우팅 (구체적인 의도부터 우선 판단) ──
  {
    const P=chatFindAllPeriods(text),F=chatDetectFactories(text),M=chatDetectMetrics(text);
    const monthPs=P.filter(p=>p.mode==='month');
    if(/예측|예상|전망|추정|될까|나올까|얼마나\s*나올/.test(text))return anForecast(text,F);
    if(/목표|3\.5\s*h?|달성/.test(text))return anTargetReport(text,P,F);
    if(/이슈|이상\s*(징후|여부|유무|감지|점검|있|없|한)|특이|급감|급증|급격|문제|점검|진단|비정상|고장|저하|특별|원인|이유|(감소|증가|하락|상승|떨어|늘).{0,20}(검토|확인|있는지|있어|있나|봐)/.test(text))return anIssueReport(text,P);
    if(/가장|제일|최고|최대|최저|최소|순위|랭킹|top\s*\d*|탑\s*\d|베스트|워스트|상위|하위/i.test(text))return anRankReport(text,P,F,M);
    if(/전년|작년\s*(같은|동월|대비|보다)|전월|지난\s*달\s*(대비|보다)|증감|yoy|mom|대비/i.test(text)&&!/추세|트렌드|추이/.test(text)&&monthPs.length<=1&&P.length<=1)return anChangeReport(text,P,F,M);
    if(/요일|주말|평일/.test(text))return anWeekdayReport(text,P,F);
    if(/추세|트렌드|경향|흐름|추이|패턴|변화/.test(text))return anTrendReport(text,P,F,M);
    if(/통계|분포|표준\s*편차|편차|변동|중앙값|산포|들쭉/.test(text))return anStatsReport(text,P,F,M);
    if(/분석|리포트|보고서|인사이트|브리핑|종합|요약\s*해|현황|어땠|어때/.test(text)&&P.length<=1&&!/비교/.test(text))return anSummaryReport(text,P,F);
  }

  // 이 챗봇은 이전 대화 맥락(예: "이게 뭐야?"의 "이게")을 기억하지 않으므로,
  // 기간/지표 등 데이터 조회 의도가 전혀 없으면 엉뚱한 데이터를 보여주지 말고 솔직하게 안내한다.
  const periodsFound=chatFindAllPeriods(text);
  const metricsFound=chatDetectMetrics(text);
  const explicitAll=/전체|누적|처음부터/.test(text);
  const factoryMentioned=/1\s*공장|2\s*공장|각각|각자|공장별/.test(text);
  const compareMentioned=/비교/.test(text);
  if(!periodsFound.length&&!metricsFound.length&&!explicitAll&&!factoryMentioned&&!compareMentioned){
    return'질문을 정확히 이해하지 못했어요. 이 챗봇은 이전 대화를 기억하지 못하니, 매번 기간·공장·항목을 포함해서 다시 물어봐 주세요.<br><br>예시:<br>'+CHAT_EXAMPLES.map(e=>'· '+e).join('<br>');
  }

  let periods=periodsFound;
  if(!periods.length){
    if(explicitAll)periods=[{mode:'all',label:'전체 기간'}];
    else{const lastYM=RAW.daily[RAW.daily.length-1].date.slice(0,7);periods=[{mode:'month',ym:lastYM,label:chatMonthLabel(lastYM)}];}
  }
  const facs=chatDetectFactories(text);
  const metrics=metricsFound.length?metricsFound:['gen','hours','usage','ratio'];
  const wantCompareFactories=/비교/.test(text)&&facs.length===1&&periods.length===1;

  // 공장 vs 공장 비교 (기간 1개, "비교"라는 말은 있는데 공장을 특정 안 한 경우 기본 해석)
  if(wantCompareFactories){
    const period=periods[0],s1=chatStats(period,'1'),s2=chatStats(period,'2');
    if(s1.days===0)return period.label+' 데이터가 없습니다.';
    chatLastCtx={periods,facs:['1','2'],metrics};
    const lines=metrics.map(m=>'· 1공장: '+chatMetricLine(s1,m)+'<br>&nbsp;&nbsp;2공장: '+chatMetricLine(s2,m));
    return'<b>'+period.label+' 1공장 vs 2공장 비교</b><br>'+lines.join('<br>');
  }

  // 기간이 여러 개면(예: "25년1~7월과 26년1~7월 비교/알려줘") 기간별로 나열
  if(periods.length>1){
    if(facs.length===1)chatLastCtx={periods,facs,metrics};
    const blocks=periods.map(period=>{
      const rows=facs.map(fac=>{
        const stats=chatStats(period,fac);
        if(stats.days===0)return'&nbsp;&nbsp;'+(facs.length>1?chatFactoryLabel(fac)+': ':'')+'데이터 없음';
        const line=metrics.map(m=>chatMetricLine(stats,m)).join(', ');
        return'&nbsp;&nbsp;'+(facs.length>1?chatFactoryLabel(fac)+': ':'')+line;
      });
      return'· <b>'+period.label+'</b><br>'+rows.join('<br>');
    });
    let out='<b>기간별 비교</b><br>'+blocks.join('<br>');
    // 기간 2개 · 공장 1개면 증감률도 바로 계산해서 붙인다
    if(periods.length===2&&facs.length===1){
      const a=chatStats(periods[0],facs[0]),b=chatStats(periods[1],facs[0]);
      if(a.days&&b.days){
        const pick={gen:s=>s.kwh,hours:s=>s.hrs,usage:s=>s.usage,ratio:s=>s.ratio};
        out+='<div class="an-box"><b>'+periods[1].label+' vs '+periods[0].label+'</b><br>'+metrics.map(m=>{const v1=pick[m](a),v2=pick[m](b);return'· '+anMetricName(m)+' '+anChgHtml(m,m==='ratio'?v2-v1:anPct(v2,v1));}).join('<br>')
          +(a.days!==b.days?'<br><span class="an-note">일수가 다름('+a.days+'일 vs '+b.days+'일) — 발전량·사용량은 합계 기준</span>':'')+'</div>';
      }
    }
    // 같은 메시지에 "특정월에 차이가 있어?" 같은 요청이 함께 있으면 월별 비교도 바로 붙여준다
    if(periods.length===2&&facs.length===1&&/특정\s*월|어느\s*달|몇\s*월|월별로|월별\s*차이/.test(text)){
      const mbm=chatMonthByMonthCompare(periods[0],periods[1],facs[0],metrics[0]);
      if(mbm){
        if(!mbm.length||mbm[0].gap===0)out+='<br><br>월별로 봐도 뚜렷하게 차이나는 달은 없었어요.';
        else{
          const unit=chatGapUnit(metrics[0]),top=mbm.slice(0,3);
          const lines=top.map(r=>'· '+chatMonthLabel(r.mo1)+' vs '+chatMonthLabel(r.mo2)+': '+chatGapValFmt(metrics[0],r.v1)+unit+' → '+chatGapValFmt(metrics[0],r.v2)+unit+' (차이 '+chatGapValFmt(metrics[0],r.gap)+unit+')');
          out+='<br><br><b>차이가 컸던 달 (상위 '+top.length+'개)</b><br>'+lines.join('<br>');
        }
      }
    }
    return out;
  }

  // 기간 1개, 공장 1개 이상 → 요약
  const period=periods[0];
  if(facs.length===2)chatLastCtx={periods,facs,metrics};
  const blocks=facs.map(fac=>{
    const stats=chatStats(period,fac);
    if(stats.days===0)return chatFactoryLabel(fac)+': 데이터 없음';
    const label=facs.length>1?chatFactoryLabel(fac):chatFactoryLabel(fac);
    const lines=metrics.map(m=>'· '+chatMetricLine(stats,m)).join('<br>');
    return(facs.length>1?'<b>'+label+'</b><br>':'')+lines;
  });
  const title=period.label+' '+(facs.length>1?'공장별':chatFactoryLabel(facs[0]))+' '+(chatDetectMetrics(text).length?'':'요약');
  return'<b>'+title.trim()+'</b><br>'+blocks.join('<br>');
}
function chatAppend(role,html){
  const box=document.getElementById('chatMessages');
  const row=document.createElement('div');
  row.className='chat-msg chat-'+role;
  row.innerHTML=html;
  box.appendChild(row);
  box.scrollTop=box.scrollHeight;
}
function chatSend(){
  const input=document.getElementById('chatInput'),text=input.value.trim();
  if(!text)return;
  chatAppend('user',text.replace(/</g,'&lt;'));
  input.value='';
  setTimeout(()=>{
    anPendingCharts=[];
    let html;
    try{html=chatAnswer(text);}catch(e){console.error(e);anPendingCharts=[];html='분석 중 오류가 발생했어요. 질문을 조금 바꿔서 다시 시도해 주세요.';}
    chatAppend('bot',html);
    anRenderCharts();
  },200);
}
function chatAsk(q){document.getElementById('chatInput').value=q;chatSend();}
function chatWide(){
  document.getElementById('chatPanel').classList.toggle('chat-wide');
  document.querySelectorAll('#chatMessages .chat-chart').forEach(el=>{try{Plotly.Plots.resize(el);}catch(e){}});
}
function chatToggle(){
  const panel=document.getElementById('chatPanel');
  const opening=panel.style.display==='none'||!panel.style.display;
  panel.style.display=opening?'flex':'none';
  if(opening&&!panel.dataset.greeted){
    document.getElementById('chatChips').innerHTML=CHAT_CHIPS.map(c=>'<button class="chat-chip" data-q="'+c[1]+'">'+c[0]+'</button>').join('');
    document.querySelectorAll('#chatChips .chat-chip').forEach(b=>b.addEventListener('click',()=>chatAsk(b.dataset.q)));
    chatAppend('bot','안녕하세요! 태양광 발전 데이터를 <b>조회·분석</b>해 드려요.<br>아래 버튼을 누르거나 직접 물어보세요.<br><br>'
      +'<b>분석 기능</b><br>· 🔍 이상 징후 점검 — 설비 의심일 / 기상 영향 / 공장 간 효율 변화<br>· 📋 월간 종합 분석 · 📈 추세 · ↕ 전월/전년 대비<br>· 🏆 순위(최고/최저 날·주·달) · 🔮 예측 · 🎯 목표 달성 · 📊 통계 · 📅 요일 패턴'
      +'<br><br>예시:<br>'+CHAT_EXAMPLES.map(e=>'· '+e).join('<br>'));
    panel.dataset.greeted='1';
  }
}
document.getElementById('chatInput').addEventListener('keydown',e=>{if(e.key==='Enter')chatSend();});
